name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      
      - name: Run Python tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short
      
      - name: Check Python syntax
        run: |
          cd backend
          python -m compileall -q momento/

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install black flake8 mypy
      
      - name: Run Black
        run: |
          cd backend
          black --check momento/ tests/
      
      - name: Run Flake8
        run: |
          cd backend
          flake8 momento/ tests/ --max-line-length=88
      
      - name: Run MyPy
        run: |
          cd backend
          mypy momento/ --ignore-missing-imports

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: |
          cd web
          bun install
      
      - name: Lint
        run: |
          cd web
          bun run lint
      
      - name: Build
        run: |
          cd web
          bun run build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test, lint, frontend]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Build frontend
        run: |
          cd web
          bun install
          bun run build
      
      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add your deployment commands here